CONFIG_TEST=y
CONFIG_ZTEST=y
CONFIG_MSPI=y

# Ensure system workqueue has higher priority than test thread to process
# async MSPI transfer completion work items. The workqueue needs to be able
# to preempt the test thread to avoid timeouts.
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1
CONFIG_ZTEST_THREAD_PRIORITY=0
